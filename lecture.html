<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
  <meta name="theme-color" content="#0A0A0A">
  <meta name="description" content="ARVEXA School - Lecture">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="icon" href="icon.png" type="image/png">

  <!-- ⚡ PRECONNECT -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin>

  <!-- ⚡ PRELOAD -->
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Playfair+Display:wght@700&display=swap">
  <link rel="preload" as="style" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
  <link rel="preload" as="image" href="icon.png" fetchpriority="high">

  <!-- ⚡ CSS -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Playfair+Display:wght@700&display=swap">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
  <link rel="stylesheet" href="assets/arvexa-tokens.css">
  <link rel="stylesheet" href="assets/arvexa-core.css">

  <!-- ⚡ CSS spécifique à lecture.html -->
  <style>
    /* ============================================================
       THÈME CLAIR — override des tokens
       ============================================================ */
    html[data-theme="light"] {
      --bg-dark: #FAF7F0;
      --bg-surface: #FFFFFF;
      --bg-card: rgba(255, 255, 255, 0.85);
      --text-light: #1A1A1A;
      --text-dim: #4A4A4A;
      --text-muted: #7A7A7A;
      --text-body: #2A2A2A;
      --border-soft: rgba(0, 0, 0, 0.08);
      --card-border: rgba(184, 134, 11, 0.15);
      --card-border-hover: rgba(184, 134, 11, 0.25);
      --accent: #96650A;
      --accent-bright: #B8860B;
      --success: #1E6B47;
      --warning: #B37D00;
      --blue: #2563EB;
    }
    html[data-theme="light"] .gradient-bg {
      background:
        radial-gradient(ellipse 40% 30% at 30% 15%, rgba(184, 134, 11, 0.06) 0%, transparent 70%),
        radial-gradient(ellipse 35% 25% at 75% 85%, rgba(26, 58, 42, 0.04) 0%, transparent 60%),
        linear-gradient(180deg, #FAF7F0 0%, #F0EBE0 100%);
    }

    /* ============================================================
       HEADER EXTRAS
       ============================================================ */
    .header-tools { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
    .header-tool {
      display: flex; align-items: center; gap: 5px;
      padding: 5px 11px; border-radius: 20px;
      border: 1px solid var(--border-soft);
      background: transparent;
      color: var(--text-dim);
      font-size: 11px; font-weight: 600;
      cursor: pointer; transition: var(--transition);
      font-family: var(--font-body);
      white-space: nowrap;
    }
    .header-tool:hover { color: var(--text-light); border-color: var(--card-border-hover); }
    .header-tool i { font-size: 12px; }
    .header-tool.tts-speaking { border-color: rgba(96,165,250,0.4); background: rgba(96,165,250,0.15); color: var(--blue); }
    .header-tool.tts-speaking i { animation: ttsPulse 1.2s ease-in-out infinite; }
    .header-tool.tts-paused { border-color: rgba(224,184,74,0.3); background: rgba(224,184,74,0.08); color: var(--accent-bright); }
    @keyframes ttsPulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }

    .theme-btn {
      width: 34px; height: 34px; border-radius: 50%;
      border: 1px solid var(--border-soft); background: transparent;
      color: var(--text-dim); cursor: pointer; transition: var(--transition);
      font-size: 13px; display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .theme-btn:hover { border-color: var(--card-border-hover); color: var(--accent-bright); background: rgba(184,134,11,0.06); }
    .theme-btn i { transition: transform 0.3s ease; }
    .theme-btn:hover i { transform: rotate(15deg); }

    .notes-badge {
      position: absolute; top: 4px; right: 4px;
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--success); display: none;
    }
    .notes-badge.show { display: block; }

    /* ============================================================
       BARRE DE PROGRESSION LECTURE
       ============================================================ */
    .read-progress {
      position: fixed; top: 0; left: 0; right: 0;
      height: 2px; background: transparent;
      z-index: 100; pointer-events: none;
    }
    .read-progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--accent), var(--accent-bright));
      width: 0%; transition: width 0.15s ease-out;
      box-shadow: 0 0 8px rgba(224, 184, 74, 0.5);
    }

    /* ============================================================
       BARRE DE PROGRESSION TTS
       ============================================================ */
    .tts-progress {
      position: fixed; bottom: 0; left: 0; right: 0;
      height: 3px; background: rgba(96,165,250,0.1);
      z-index: 100; opacity: 0; pointer-events: none;
      transition: opacity 0.3s ease;
    }
    .tts-progress.active { opacity: 1; }
    .tts-progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--blue), var(--accent-bright));
      width: 0%; transition: width 0.4s ease;
      box-shadow: 0 0 12px rgba(96,165,250,0.5);
    }

    /* ============================================================
       CONTENT WRAPPER
       ============================================================ */
    .content-wrapper {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 16px 16px 60px;
      max-width: 820px;
      margin: 0 auto;
      width: 100%;
      min-width: 0;
    }
    .content-wrapper::-webkit-scrollbar { width: 4px; }
    .content-wrapper::-webkit-scrollbar-track { background: transparent; }
    .content-wrapper::-webkit-scrollbar-thumb {
      background: rgba(184, 134, 11, 0.2);
      border-radius: 10px;
    }

    #contentBody {
      min-height: 200px;
      min-width: 0; max-width: 100%;
      font-size: 16px; line-height: 1.85;
      color: var(--text-body);
      letter-spacing: 0.005em;
      overflow-wrap: break-word;
      word-wrap: break-word;
    }

    /* ============================================================
       ÉTATS
       ============================================================ */
    #contentBody .arv-loading { padding: 60px 20px; }

    .content-unavailable {
      text-align: center; padding: 60px 24px;
      display: flex; flex-direction: column;
      align-items: center; gap: 16px;
      min-height: 320px; justify-content: center;
    }
    .content-unavailable .cu-icon {
      width: 72px; height: 72px; border-radius: 20px;
      display: flex; align-items: center; justify-content: center;
      background: rgba(184, 134, 11, 0.08);
      border: 1px solid var(--card-border);
      font-size: 32px; color: var(--accent-bright);
      margin-bottom: 4px;
    }
    .content-unavailable h2 {
      font-family: var(--font-serif);
      font-size: 22px; font-weight: 700;
      color: var(--text-light); margin: 0;
    }
    .content-unavailable p {
      font-size: 14px; color: var(--text-dim);
      max-width: 380px; line-height: 1.7; margin: 0;
    }
    .content-unavailable .cu-actions {
      display: flex; gap: 10px; margin-top: 8px;
      flex-wrap: wrap; justify-content: center;
    }
    .content-unavailable .cu-btn {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 10px 22px; border-radius: 100px;
      border: 1px solid var(--border-soft); background: transparent;
      color: var(--text-light); text-decoration: none;
      font-size: 13px; font-weight: 600;
      cursor: pointer; transition: var(--transition);
      font-family: var(--font-body);
    }
    .content-unavailable .cu-btn:hover {
      border-color: var(--card-border-hover);
      background: rgba(184, 134, 11, 0.08);
      color: var(--accent-bright);
    }
    .content-unavailable .cu-btn.primary {
      background: linear-gradient(135deg, var(--accent-bright), var(--accent));
      color: #0A0A0A; border-color: transparent;
    }
    .content-unavailable .cu-btn.primary:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 22px rgba(184, 134, 11, 0.3);
      color: #0A0A0A;
    }

    /* ============================================================
       SABLIER ANIMÉ
       ============================================================ */
    .hourglass-wrap {
      position: relative; width: 100px; height: 100px;
      margin: 0 auto 20px;
      display: flex; align-items: center; justify-content: center;
    }
    .hourglass-wrap::before {
      content: ''; position: absolute; inset: -20%;
      border-radius: 50%;
      background: radial-gradient(circle,
        rgba(224, 184, 74, 0.25) 0%,
        rgba(224, 184, 74, 0.08) 40%,
        transparent 70%);
      animation: hourglassHalo 3s ease-in-out infinite;
      pointer-events: none;
    }
    @keyframes hourglassHalo {
      0%, 100% { transform: scale(1); opacity: 0.6; }
      50% { transform: scale(1.15); opacity: 1; }
    }
    .hourglass-svg {
      width: 72px; height: 72px;
      position: relative; z-index: 1;
      animation: hourglassTilt 6s ease-in-out infinite;
      filter: drop-shadow(0 0 12px rgba(224, 184, 74, 0.4));
    }
    @keyframes hourglassTilt {
      0%, 100% { transform: rotate(-3deg); }
      50% { transform: rotate(3deg); }
    }
    .hourglass-svg .frame {
      stroke: var(--accent-bright); stroke-width: 2;
      fill: none; stroke-linecap: round; stroke-linejoin: round;
    }
    .hourglass-svg .glass {
      fill: rgba(224, 184, 74, 0.08);
      stroke: rgba(224, 184, 74, 0.4); stroke-width: 1.5;
    }
    .hourglass-svg .sand-top {
      fill: var(--accent-bright);
      animation: sandTopDrain 4s ease-in-out infinite;
      transform-origin: center top;
    }
    @keyframes sandTopDrain {
      0%, 10% { transform: scaleY(1); opacity: 1; }
      80%, 90% { transform: scaleY(0.05); opacity: 0.9; }
      100% { transform: scaleY(1); opacity: 1; }
    }
    .hourglass-svg .sand-stream {
      fill: var(--accent-bright);
      animation: sandStream 4s ease-in-out infinite;
    }
    @keyframes sandStream {
      0%, 15% { opacity: 0.9; }
      75%, 85% { opacity: 0.9; }
      95%, 100% { opacity: 0; }
    }
    .hourglass-svg .sand-bottom {
      fill: var(--accent-bright);
      animation: sandBottomFill 4s ease-in-out infinite;
      transform-origin: center bottom;
    }
    @keyframes sandBottomFill {
      0%, 10% { transform: scaleY(0.1); opacity: 0.8; }
      80%, 90% { transform: scaleY(1); opacity: 1; }
      100% { transform: scaleY(0.1); opacity: 0.8; }
    }

    /* ============================================================
       NAV BAR BAS DE PAGE
       ============================================================ */
    .nav-bar {
      display: flex; justify-content: space-between; align-items: center;
      gap: 12px; margin-top: 32px; padding-top: 20px;
      border-top: 1px solid var(--border-soft);
      flex-wrap: wrap;
    }
    .nav-btn {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 10px 20px; border-radius: 100px;
      border: 1px solid var(--border-soft);
      background: var(--bg-card);
      color: var(--text-dim); font-size: 13px; font-weight: 500;
      cursor: pointer; transition: var(--transition);
      font-family: var(--font-body); text-decoration: none;
    }
    .nav-btn:hover:not(:disabled) {
      border-color: var(--card-border-hover);
      color: var(--text-light);
      transform: translateY(-1px);
    }
    .nav-btn:disabled { opacity: 0.3; cursor: not-allowed; }
    .nav-btn i { font-size: 12px; }
    .nav-btn.primary {
      background: linear-gradient(135deg, var(--accent-bright), var(--accent));
      color: #0A0A0A; border-color: transparent; font-weight: 700;
    }
    .nav-btn.primary:hover:not(:disabled) {
      box-shadow: 0 6px 22px rgba(184, 134, 11, 0.3);
      color: #0A0A0A;
    }
    .nav-counter {
      font-size: 12px; color: var(--text-muted);
      font-weight: 500; padding: 0 8px;
    }

    /* ============================================================
       MODAL NOTES
       ============================================================ */
    .modal-overlay {
      position: fixed; inset: 0;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      z-index: 9999; display: none;
      align-items: center; justify-content: center;
      padding: 20px; animation: fadeIn 0.3s ease;
    }
    .modal-overlay.show { display: flex; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    .modal {
      background: var(--bg-surface);
      border: 1px solid var(--card-border);
      border-radius: var(--radius-lg);
      padding: 24px 20px; max-width: 480px; width: 100%;
      max-height: 90vh; overflow-y: auto;
      animation: slideUp 0.3s ease; position: relative;
    }
    @keyframes slideUp {
      from { transform: translateY(30px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    .modal .modal-close {
      position: absolute; top: 12px; right: 12px;
      width: 32px; height: 32px; border-radius: 8px;
      background: transparent; border: 1px solid transparent;
      color: var(--text-muted); font-size: 16px;
      cursor: pointer; transition: var(--transition);
      display: flex; align-items: center; justify-content: center;
    }
    .modal .modal-close:hover {
      color: var(--text-light);
      background: rgba(255, 255, 255, 0.05);
      border-color: var(--border-soft);
    }
    .modal .modal-title {
      font-size: 18px; font-weight: 700;
      font-family: var(--font-serif);
      color: var(--text-light);
      margin-bottom: 4px; padding-right: 30px;
    }
    .modal .modal-title span { color: var(--accent-bright); }
    .modal .modal-sub {
      font-size: 12px; color: var(--text-dim);
      margin-bottom: 16px;
    }
    .modal textarea {
      width: 100%; min-height: 180px; max-height: 400px;
      padding: 14px 16px; border-radius: 12px;
      border: 1px solid var(--border-soft);
      background: rgba(255, 255, 255, 0.02);
      color: var(--text-light); font-size: 14px;
      font-family: var(--font-body);
      resize: vertical; outline: none;
      transition: var(--transition); line-height: 1.7;
    }
    html[data-theme="light"] .modal textarea { background: rgba(0, 0, 0, 0.02); }
    .modal textarea:focus { border-color: rgba(184, 134, 11, 0.3); }
    .modal textarea::placeholder { color: var(--text-muted); }
    .modal .modal-actions {
      display: flex; gap: 10px; margin-top: 14px;
    }
    .modal .modal-actions button {
      flex: 1; padding: 11px; border-radius: 100px;
      border: none; font-size: 13px; font-weight: 600;
      cursor: pointer; transition: var(--transition);
      font-family: var(--font-body);
    }
    .modal .modal-actions .btn-save {
      background: linear-gradient(135deg, var(--accent-bright), var(--accent));
      color: #0A0A0A;
    }
    .modal .modal-actions .btn-save:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 24px rgba(184, 134, 11, 0.25);
    }
    .modal .modal-actions .btn-cancel {
      background: rgba(255, 255, 255, 0.04);
      color: var(--text-dim);
      border: 1px solid var(--border-soft);
    }
    html[data-theme="light"] .modal .modal-actions .btn-cancel { background: rgba(0, 0, 0, 0.04); }
    .modal .modal-actions .btn-cancel:hover {
      background: rgba(255, 255, 255, 0.08);
      color: var(--text-light);
    }
    .modal .note-saved {
      font-size: 12px; color: var(--success);
      margin-top: 10px; display: none;
      align-items: center; gap: 6px;
    }
    .modal .note-saved.show { display: flex; }

    /* ============================================================
       TYPOGRAPHIE CONTENU (headings, listes, etc.)
       ============================================================ */
    #contentBody h1, #contentBody h2, #contentBody h3,
    #contentBody h4, #contentBody h5, #contentBody h6 {
      font-family: var(--font-serif);
      color: var(--text-light);
      font-weight: 700;
      line-height: 1.25;
      letter-spacing: -0.015em;
      overflow-wrap: break-word;
      scroll-margin-top: 80px;
    }
    #contentBody h1 {
      font-size: clamp(26px, 3.5vw, 34px);
      margin: 0 0 20px; padding-bottom: 14px;
      border-bottom: 1px solid var(--card-border);
      position: relative;
    }
    #contentBody h1::after {
      content: ''; position: absolute;
      bottom: -1px; left: 0;
      width: 50px; height: 2px;
      background: linear-gradient(90deg, var(--accent-bright), transparent);
    }
    #contentBody h2 {
      font-size: clamp(22px, 3vw, 28px);
      margin: 44px 0 18px; padding-bottom: 12px;
      border-bottom: 1px solid var(--border-soft);
      position: relative;
    }
    #contentBody h2::after {
      content: ''; position: absolute;
      bottom: -1px; left: 0;
      width: 36px; height: 2px;
      background: var(--accent-bright);
    }
    #contentBody h3 { font-size: clamp(19px, 2.5vw, 22px); margin: 32px 0 14px; }
    #contentBody h4 { font-family: var(--font-body); font-size: clamp(16px, 2vw, 18px); font-weight: 600; margin: 26px 0 12px; }
    #contentBody h5 {
      font-family: var(--font-body); font-size: 15px; font-weight: 700;
      margin: 22px 0 10px; color: var(--accent-bright);
      text-transform: uppercase; letter-spacing: 1px;
    }
    #contentBody h6 {
      font-family: var(--font-body); font-size: 13px; font-weight: 700;
      margin: 18px 0 8px; color: var(--text-muted);
      text-transform: uppercase; letter-spacing: 1.2px;
    }
    #contentBody p { margin: 0 0 18px; color: var(--text-body); }
    #contentBody p:last-child { margin-bottom: 0; }
    #contentBody strong { color: var(--text-light); font-weight: 600; }
    #contentBody em { color: var(--accent-bright); font-style: italic; font-weight: 500; }
    #contentBody del { color: var(--text-muted); text-decoration: line-through; }
    #contentBody mark {
      background: rgba(184, 134, 11, 0.2);
      color: var(--text-light);
      padding: 1px 4px; border-radius: 3px;
    }
    #contentBody a {
      color: var(--accent-bright); text-decoration: none;
      border-bottom: 1px solid rgba(224, 184, 74, 0.3);
      transition: var(--transition); word-break: break-word;
    }
    #contentBody a:hover {
      border-bottom-color: var(--accent-bright);
      background: rgba(184, 134, 11, 0.06);
      padding: 0 2px;
    }
    #contentBody ul, #contentBody ol { margin: 16px 0 20px; padding-left: 26px; }
    #contentBody li { margin: 6px 0; line-height: 1.8; }
    #contentBody pre {
      margin: 20px 0; padding: 16px 18px;
      border-radius: 12px; background: rgba(0, 0, 0, 0.4);
      border: 1px solid var(--border-soft);
      overflow-x: auto; -webkit-overflow-scrolling: touch;
      font-family: var(--font-mono);
      font-size: 13px; line-height: 1.6; color: var(--text-body);
    }
    html[data-theme="light"] #contentBody pre { background: rgba(0, 0, 0, 0.04); }
    #contentBody code {
      font-family: var(--font-mono);
      font-size: 0.9em;
      background: rgba(184, 134, 11, 0.1);
      color: var(--accent-bright);
      padding: 2px 7px; border-radius: 5px;
      word-break: break-word;
    }
    #contentBody pre code { background: transparent; color: inherit; padding: 0; }
    #contentBody blockquote {
      margin: 22px 0; padding: 4px 0 4px 20px;
      border-left: 3px solid var(--accent-bright);
      color: var(--text-dim);
      font-style: italic; font-size: 15.5px; line-height: 1.8;
    }
    #contentBody blockquote strong { color: var(--text-light); font-style: normal; }
    #contentBody hr {
      margin: 36px 0; border: none; height: 1px;
      background: linear-gradient(90deg, transparent, var(--card-border), transparent);
    }
    #contentBody img {
      max-width: 100%; height: auto;
      border-radius: 10px; margin: 16px 0; display: block;
    }
    #contentBody svg { max-width: 100%; height: auto; display: block; margin: 16px auto; }
    #contentBody figure {
      margin: 24px 0; padding: 0;
      display: flex; flex-direction: column;
      align-items: center; min-width: 0;
    }
    #contentBody figure img, #contentBody figure svg {
      max-width: 100%; height: auto;
      background: rgba(255, 255, 255, 0.015);
      border: 1px solid var(--border-soft);
      border-radius: 12px; padding: 8px;
      box-sizing: border-box;
    }
    html[data-theme="light"] #contentBody figure img,
    html[data-theme="light"] #contentBody figure svg {
      background: rgba(255, 255, 255, 0.6);
    }
    #contentBody figcaption {
      margin-top: 12px; font-size: 13px;
      color: var(--text-dim); font-style: italic;
      text-align: center; line-height: 1.6;
      max-width: 100%; overflow-wrap: break-word;
    }
    #contentBody table {
      width: 100%; border-collapse: collapse;
      margin: 22px 0; font-size: 14px;
      border: 1px solid var(--border-soft);
      border-radius: 10px; overflow: hidden;
      word-break: break-word;
    }
    #contentBody th, #contentBody td {
      padding: 11px 14px; text-align: left;
      border-bottom: 1px solid var(--border-soft);
      overflow-wrap: break-word; word-break: break-word;
      min-width: 0; vertical-align: top;
    }
    #contentBody thead th {
      background: rgba(224, 184, 74, 0.06);
      color: var(--accent-bright);
      font-size: 11px; font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      white-space: nowrap;
    }
    #contentBody tbody tr:last-child td { border-bottom: none; }
    #contentBody tbody tr:hover { background: rgba(184, 134, 11, 0.03); }

    /* ============================================================
       KATEX
       ============================================================ */
    .katex { font-size: 1.05em; color: var(--text-light); }
    .katex-display {
      margin: 22px 0; padding: 0 8px;
      overflow-x: auto; overflow-y: hidden;
      -webkit-overflow-scrolling: touch;
      text-align: center;
    }
    .katex-display > .katex { font-size: 1.15em; white-space: normal; }
    .katex .mathnormal, .katex .mathit { font-style: italic; color: var(--text-light); }
    .katex .mop, .katex .mord.text {
      font-family: 'KaTeX_Main', 'Times New Roman', serif;
      font-style: normal; color: var(--text-light);
    }
    .katex .mbin, .katex .mrel { color: var(--text-body); }
    .katex .frac-line { border-bottom-color: var(--text-light); }
    .katex .sqrt > .root { color: var(--accent-bright); }

    #contentBody * { min-width: 0; max-width: 100%; box-sizing: border-box; }
    #contentBody > * { overflow-wrap: break-word; word-wrap: break-word; }

    /* ============================================================
       RESPONSIVE
       ============================================================ */
    @media (max-width: 600px) {
      .content-wrapper { padding: 12px 14px 60px; }
      #contentBody { font-size: 15.5px; line-height: 1.8; }
      #contentBody h1 { font-size: 24px; }
      #contentBody h2 { font-size: 20px; }
      #contentBody h3 { font-size: 17px; }
      #contentBody p { font-size: 15px; }
      .header-tool span { display: none; }
      .header-tool { padding: 5px 9px; }
      .nav-btn { font-size: 12px; padding: 8px 16px; }
    }
    @media (max-width: 380px) {
      .content-wrapper { padding: 10px 12px 50px; }
      #contentBody { font-size: 15px; }
      #contentBody h1 { font-size: 22px; }
      #contentBody h2 { font-size: 18px; }
      #contentBody p { font-size: 14.5px; }
    }
  </style>

  <script src="assets/arvexa-speculation.js" defer></script>
  <script src="assets/arvexa-transitions.js" defer></script>
  <script src="register-sw.js" defer></script>
</head>
<body>

  <div class="gradient-bg"></div>

  <!-- BARRE DE PROGRESSION LECTURE -->
  <div class="read-progress">
    <div class="read-progress-fill" id="readProgressFill"></div>
  </div>

  <!-- HEADER -->
  <header class="arv-header">
    <div class="arv-header-left">
      <button class="arv-back-btn" id="backBtn" aria-label="Retour">
        <i class="fas fa-arrow-left"></i>
      </button>
      <div class="arv-page-title" id="pageTitle">
        <i class="fas fa-book-open"></i> <span>Chargement...</span>
      </div>
    </div>
    <div class="arv-header-right header-tools">
      <button class="theme-btn" id="themeBtn" aria-label="Changer de thème">
        <i class="fas fa-moon" id="themeIcon"></i>
      </button>
      <button class="header-tool" id="ttsBtn" aria-label="Écouter">
        <i class="fas fa-volume-up"></i>
        <span>Écouter</span>
      </button>
      <button class="header-tool" id="notesBtn">
        <i class="fas fa-pen"></i>
        <span>Notes</span>
        <span class="notes-badge" id="notesDot"></span>
      </button>
    </div>
  </header>

  <!-- CONTENU -->
  <div class="content-wrapper" id="contentWrapper">
    <div id="contentBody">
      <div class="arv-loading">
        <div class="arv-loading-spinner"></div>
        <p>Chargement du contenu...</p>
      </div>
    </div>

    <div class="nav-bar" id="navBar">
      <button class="nav-btn" id="prevBtn" disabled>
        <i class="fas fa-chevron-left"></i> Précédent
      </button>
      <span class="nav-counter" id="partCounter">1 / 1</span>
      <button class="nav-btn primary" id="nextBtn">
        Suivant <i class="fas fa-chevron-right"></i>
      </button>
    </div>
  </div>

  <!-- BARRE DE PROGRESSION TTS -->
  <div class="tts-progress" id="ttsProgress">
    <div class="tts-progress-fill" id="ttsProgressFill"></div>
  </div>

  <!-- MODAL NOTES -->
  <div class="modal-overlay" id="notesModal">
    <div class="modal">
      <button class="modal-close" id="modalClose"><i class="fas fa-times"></i></button>
      <div class="modal-title">📝 Mes <span>notes</span></div>
      <div class="modal-sub" id="modalSub">Partie 1</div>
      <textarea id="notesTextarea" placeholder="Écris ici ce que tu as compris, des points importants, des questions..."></textarea>
      <div class="note-saved" id="noteSaved"><i class="fas fa-check-circle"></i> Notes enregistrées !</div>
      <div class="modal-actions">
        <button class="btn-cancel" id="modalCancel">Annuler</button>
        <button class="btn-save" id="modalSave">💾 Enregistrer</button>
      </div>
    </div>
  </div>

  <!-- ============================================================ -->
  <script type="importmap">
  {
    "imports": {
      "firebase/firestore": "https://www.gstatic.com/firebasejs/12.12.1/firebase-firestore.js"
    }
  }
  </script>

  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js" defer></script>

  <script type="module">
  // ================================================================
  // LECTURE.HTML — Logique métier
  // ================================================================

  import { db } from './assets/arvexa-firebase.js';
  import { authGuard, isUserPremium, getReadParts, getCachedUserData, saveUserDataToCache } from './assets/arvexa-auth.js';
  import { doc, onSnapshot, getDoc, updateDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-firestore.js";

  // ================================================================
  // URL PARAMS
  // ================================================================
  const params = new URLSearchParams(location.search);
  const subject = params.get('subject') || 'mathematiques';
  const chapter = parseInt(params.get('chapter')) || 0;
  const tab = params.get('tab') || 'cours';
  const partIndex = parseInt(params.get('part')) || 0;

  // ================================================================
  // DOM
  // ================================================================
  const $ = (id) => document.getElementById(id);
  const contentBody = $('contentBody');
  const pageTitle = document.querySelector('#pageTitle span');
  const backBtn = $('backBtn');
  const notesBtn = $('notesBtn');
  const notesDot = $('notesDot');
  const prevBtn = $('prevBtn');
  const nextBtn = $('nextBtn');
  const partCounter = $('partCounter');
  const readProgressFill = $('readProgressFill');
  const contentWrapper = $('contentWrapper');

  const notesModal = $('notesModal');
  const modalClose = $('modalClose');
  const modalCancel = $('modalCancel');
  const modalSave = $('modalSave');
  const notesTextarea = $('notesTextarea');
  const modalSub = $('modalSub');
  const noteSaved = $('noteSaved');

  const ttsBtn = $('ttsBtn');
  const ttsProgress = $('ttsProgress');
  const ttsProgressFill = $('ttsProgressFill');

  // ================================================================
  // STORAGE KEYS
  // ================================================================
  const THEME_KEY = 'arvexa_theme';
  const READ_KEY = 'arvexa_read_parts';
  const NOTES_KEY = 'arvexa_notes';

  // ================================================================
  // THÈME
  // ================================================================
  function applyTheme(theme) {
    const icon = $('themeIcon');
    if (theme === 'light') {
      document.documentElement.setAttribute('data-theme', 'light');
      if (icon) icon.className = 'fas fa-sun';
      const meta = document.querySelector('meta[name="theme-color"]');
      if (meta) meta.setAttribute('content', '#FAF7F0');
    } else {
      document.documentElement.removeAttribute('data-theme');
      if (icon) icon.className = 'fas fa-moon';
      const meta = document.querySelector('meta[name="theme-color"]');
      if (meta) meta.setAttribute('content', '#0A0A0A');
    }
  }

  function initTheme() {
    try {
      const saved = localStorage.getItem(THEME_KEY);
      applyTheme(saved === 'light' ? 'light' : 'dark');
    } catch (e) { applyTheme('dark'); }
  }

  initTheme();

  $('themeBtn').addEventListener('click', () => {
    const isLight = document.documentElement.getAttribute('data-theme') === 'light';
    const newTheme = isLight ? 'dark' : 'light';
    applyTheme(newTheme);
    try { localStorage.setItem(THEME_KEY, newTheme); } catch (e) {}
  });

  // ================================================================
  // STORAGE HELPERS
  // ================================================================
  function markPartAsRead() {
    const key = `${subject}_${chapter}_${tab}_${partIndex}`;
    const readParts = getReadParts();
    if (!readParts.includes(key)) {
      readParts.push(key);
      try { localStorage.setItem(READ_KEY, JSON.stringify(readParts)); } catch (e) {}
    }
  }

  function getNotesKey() {
    return `${subject}_${chapter}_${tab}_${partIndex}`;
  }

  function loadNotes() {
    try {
      const notes = JSON.parse(localStorage.getItem(NOTES_KEY) || '{}');
      const key = getNotesKey();
      if (notes[key]) {
        notesTextarea.value = notes[key];
        notesDot.classList.add('show');
      } else {
        notesTextarea.value = '';
        notesDot.classList.remove('show');
      }
    } catch (e) {}
  }

  function saveNotes() {
    try {
      const notes = JSON.parse(localStorage.getItem(NOTES_KEY) || '{}');
      const key = getNotesKey();
      const text = notesTextarea.value.trim();
      if (text) {
        notes[key] = text;
        notesDot.classList.add('show');
      } else {
        delete notes[key];
        notesDot.classList.remove('show');
      }
      localStorage.setItem(NOTES_KEY, JSON.stringify(notes));
      noteSaved.classList.add('show');
      setTimeout(() => noteSaved.classList.remove('show'), 2000);
    } catch (e) {}
  }

  // ================================================================
  // ÉTAT
  // ================================================================
  let parts = [];
  let currentIndex = partIndex;
  let isPremium = false;
  let unsubscribeUser = null;

  // ================================================================
  // PRÉ-PROCESSING
  // ================================================================
  function preprocessContent(html) {
    if (!html) return '';
    let processed = html;
    processed = processed.replace(/<style[\s\S]*?<\/style>/gi, '');
    processed = processed.replace(/<script[\s\S]*?<\/script>/gi, '');
    return processed;
  }

  // ================================================================
  // KATEX
  // ================================================================
  function renderKaTeX() {
    if (typeof renderMathInElement !== 'function') {
      setTimeout(renderKaTeX, 200);
      return;
    }
    try {
      renderMathInElement(contentBody, {
        delimiters: [
          { left: '$$', right: '$$', display: true },
          { left: '\\[', right: '\\]', display: true },
          { left: '$', right: '$', display: false },
          { left: '\\(', right: '\\)', display: false }
        ],
        throwOnError: false,
        errorColor: '#f87171',
        strict: false,
        trust: false,
        macros: {
          "\\R": "\\mathbb{R}",
          "\\C": "\\mathbb{C}",
          "\\N": "\\mathbb{N}",
          "\\Z": "\\mathbb{Z}",
          "\\Q": "\\mathbb{Q}",
          "\\Re": "\\operatorname{Re}",
          "\\Im": "\\operatorname{Im}",
          "\\arg": "\\operatorname{arg}"
        }
      });
    } catch (e) {}
  }

  // ================================================================
  // CONTENU INDISPONIBLE (avec sablier animé)
  // ================================================================
  function showContentUnavailable() {
    const partNumber = currentIndex + 1;

    const tabConfig = {
      cours: {
        description: `La partie ${partNumber} du cours de ce chapitre sera bientôt disponible.`,
        backLabel: 'Retour au cours',
        listLabel: 'Voir les autres parties'
      },
      exercices: {
        description: `L'exercice ${partNumber} de ce chapitre sera bientôt disponible.`,
        backLabel: 'Retour aux exercices',
        listLabel: 'Voir les autres exercices'
      },
      corrections: {
        description: `La correction ${partNumber} de ce chapitre sera bientôt disponible.`,
        backLabel: 'Retour aux corrections',
        listLabel: 'Voir les autres corrections'
      }
    };

    const cfg = tabConfig[tab] || tabConfig.cours;

    let title;
    if (tab === 'cours') title = `Partie ${partNumber} — Cours`;
    else if (tab === 'exercices') title = `Exercice ${partNumber}`;
    else if (tab === 'corrections') title = `Correction ${partNumber}`;
    else title = `Partie ${partNumber}`;

    const hourglassSVG = `
      <div class="hourglass-wrap">
        <svg class="hourglass-svg" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
          <path class="frame" d="M 20 15 L 80 15" />
          <path class="frame" d="M 20 85 L 80 85" />
          <path class="glass" d="M 22 17 L 78 17 L 50 50 Z" />
          <path class="glass" d="M 50 50 L 78 83 L 22 83 Z" />
          <path class="sand-top" d="M 26 20 L 74 20 L 50 47 Z" />
          <rect class="sand-stream" x="48.5" y="47" width="3" height="8" />
          <path class="sand-bottom" d="M 50 53 L 74 80 L 26 80 Z" />
        </svg>
      </div>
    `;

    contentBody.innerHTML = `
      <div class="content-unavailable">
        ${hourglassSVG}
        <h2>${title} en préparation</h2>
        <p>${cfg.description}</p>
        <div class="cu-actions">
          <a href="chapitre.html?subject=${subject}&chapter=${chapter}&tab=${tab}" class="cu-btn primary">
            <i class="fas fa-arrow-left"></i> ${cfg.backLabel}
          </a>
          <a href="matiere.html?subject=${subject}" class="cu-btn">
            <i class="fas fa-book"></i> ${cfg.listLabel}
          </a>
        </div>
      </div>
    `;
    pageTitle.textContent = `${title} en préparation`;
    document.title = `ARVEXA - ${title} en préparation`;
    prevBtn.style.display = 'none';
    nextBtn.style.display = 'none';
    partCounter.style.display = 'none';
    notesBtn.style.display = 'none';
    if (ttsBtn) ttsBtn.style.display = 'none';
  }

  // ================================================================
  // CHARGEMENT CONTENU
  // ================================================================
  function loadContent() {
    const suffix = tab === 'cours' ? 'cours' : (tab === 'exercices' ? 'exo' : 'corr');
    const manifestPath = `cours/${subject}/ch${chapter}_${suffix}.json`;

    contentBody.innerHTML = `
      <div class="arv-loading">
        <div class="arv-loading-spinner"></div>
        <p>Chargement du contenu...</p>
      </div>
    `;

    fetch(manifestPath)
      .then((r) => { if (!r.ok) throw new Error('not found'); return r.json(); })
      .then((data) => {
        parts = data.parts || [];
        if (currentIndex >= parts.length) currentIndex = 0;
        if (parts.length === 0) {
          showContentUnavailable();
          return;
        }
        renderPart();
      })
      .catch(() => {
        showContentUnavailable();
      });
  }

  function renderPart() {
    if (!parts || parts.length === 0) {
      showContentUnavailable();
      return;
    }
    if (currentIndex >= parts.length || currentIndex < 0) currentIndex = 0;

    const part = parts[currentIndex];
    if (!part) {
      showContentUnavailable();
      return;
    }

    stopTTS();

    pageTitle.textContent = part.title || 'Partie ' + (currentIndex + 1);
    document.title = 'ARVEXA - ' + (part.title || 'Lecture');

    partCounter.textContent = `${currentIndex + 1} / ${parts.length}`;
    prevBtn.disabled = currentIndex === 0;
    nextBtn.disabled = currentIndex >= parts.length - 1;
    modalSub.textContent = part.title || 'Partie ' + (currentIndex + 1);

    const filePath = `cours/${subject}/${part.file}`;
    contentBody.innerHTML = `
      <div class="arv-loading">
        <div class="arv-loading-spinner"></div>
        <p>Chargement...</p>
      </div>
    `;

    fetch(filePath)
      .then((r) => { if (!r.ok) throw new Error('not found'); return r.text(); })
      .then((html) => {
        const cleaned = preprocessContent(html);
        contentBody.innerHTML = cleaned;
        markPartAsRead();
        loadNotes();
        renderKaTeX();
        updateReadProgress();
        resetStudyTimer();
      })
      .catch(() => {
        showContentUnavailable();
      });
  }

  // ================================================================
  // PROGRESSION LECTURE
  // ================================================================
  function updateReadProgress() {
    const scrollTop = contentWrapper.scrollTop;
    const scrollHeight = contentWrapper.scrollHeight - contentWrapper.clientHeight;
    const progress = scrollHeight > 0 ? Math.min(100, (scrollTop / scrollHeight) * 100) : 0;
    readProgressFill.style.width = progress + '%';
  }

  contentWrapper.addEventListener('scroll', updateReadProgress, { passive: true });

  // ================================================================
  // NAVIGATION
  // ================================================================
  function goToPrev() {
    if (currentIndex > 0) {
      saveStudyTimeBeforeChange();
      currentIndex--;
      if (notesTextarea.value.trim()) saveNotes();
      contentWrapper.scrollTop = 0;
      renderPart();
    }
  }

  function goToNext() {
    if (currentIndex < parts.length - 1) {
      saveStudyTimeBeforeChange();
      currentIndex++;
      if (notesTextarea.value.trim()) saveNotes();
      contentWrapper.scrollTop = 0;
      renderPart();
    }
  }

  // ================================================================
  // MODAL NOTES
  // ================================================================
  function openModal() {
    notesModal.classList.add('show');
    document.body.style.overflow = 'hidden';
    notesTextarea.focus();
  }

  function closeModal() {
    notesModal.classList.remove('show');
    document.body.style.overflow = '';
  }

  // ================================================================
  // ÉVÉNEMENTS
  // ================================================================
  backBtn.addEventListener('click', () => {
    saveStudyTimeBeforeChange();
    location.href = `chapitre.html?subject=${subject}&chapter=${chapter}&tab=${tab}`;
  });

  prevBtn.addEventListener('click', goToPrev);
  nextBtn.addEventListener('click', goToNext);

  document.addEventListener('keydown', (e) => {
    if (notesModal.classList.contains('show')) {
      if (e.key === 'Escape') closeModal();
      return;
    }
    if (e.key === 'ArrowLeft' && !prevBtn.disabled) goToPrev();
    if (e.key === 'ArrowRight' && !nextBtn.disabled) goToNext();
  });

  notesBtn.addEventListener('click', openModal);
  modalClose.addEventListener('click', closeModal);
  modalCancel.addEventListener('click', closeModal);
  notesModal.addEventListener('click', (e) => { if (e.target === notesModal) closeModal(); });
  modalSave.addEventListener('click', () => { saveNotes(); closeModal(); });

  // ================================================================
  // TTS — Web Speech API
  // ================================================================
  const TTS_SUPPORTED = 'speechSynthesis' in window && 'SpeechSynthesisUtterance' in window;

  const tts = {
    synth: TTS_SUPPORTED ? window.speechSynthesis : null,
    chunks: [],
    currentChunk: 0,
    utterance: null,
    voice: null,
    isSpeaking: false,
    isPaused: false,
    isActive: false,
    rate: 0.92,
    pitch: 1,
    volume: 1,
    stopRequested: false
  };

  function loadTTSVoices() {
    if (!TTS_SUPPORTED) return;
    const voices = tts.synth.getVoices();
    if (!voices || voices.length === 0) return;
    tts.voice =
      voices.find((v) => v.lang && v.lang.toLowerCase() === 'fr-fr' && v.localService) ||
      voices.find((v) => v.lang && v.lang.toLowerCase() === 'fr-fr') ||
      voices.find((v) => v.lang && v.lang.toLowerCase().startsWith('fr')) ||
      null;
  }

  loadTTSVoices();
  if (TTS_SUPPORTED && 'onvoiceschanged' in window.speechSynthesis) {
    window.speechSynthesis.onvoiceschanged = loadTTSVoices;
  }

  function cleanTTS(text) {
    if (!text) return '';
    let result = String(text);
    result = result.replace(/\$\$([^$]+)\$\$/g, (m, f) => convertMathToSpeech(f));
    result = result.replace(/\$([^$]+)\$/g, (m, f) => convertMathToSpeech(f));
    result = result.replace(/[\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}]/gu, ' ');
    result = result.replace(/⟺/g, ' si et seulement si ');
    result = result.replace(/⟹/g, ' implique ');
    result = result.replace(/→/g, ' vers ');
    result = result.replace(/←/g, ' de ');
    result = result.replace(/∈/g, ' appartient à ');
    result = result.replace(/≤/g, ' inférieur ou égal à ');
    result = result.replace(/≥/g, ' supérieur ou égal à ');
    result = result.replace(/≠/g, ' différent de ');
    result = result.replace(/√/g, ' racine carrée de ');
    result = result.replace(/([A-Za-z0-9])²/g, '$1 au carré');
    result = result.replace(/([A-Za-z0-9])³/g, '$1 au cube');
    result = result.replace(/×/g, ' fois ');
    result = result.replace(/÷/g, ' divisé par ');
    result = result.replace(/∞/g, ' infini ');
    result = result.replace(/π/g, ' pi ');
    result = result.replace(/−/g, ' moins ');
    return result.replace(/\s+/g, ' ').trim();
  }

  function convertMathToSpeech(latex) {
    let s = String(latex);
    s = s.replace(/\\frac\{([^}]+)\}\{([^}]+)\}/g, ' $1 sur $2 ');
    s = s.replace(/\\sqrt\{([^}]+)\}/g, ' racine de $1 ');
    s = s.replace(/([a-zA-Z0-9])\^\{([^}]+)\}/g, ' $1 puissance $2 ');
    s = s.replace(/([a-zA-Z0-9])\^([a-zA-Z0-9])/g, ' $1 puissance $2 ');
    s = s.replace(/([a-zA-Z0-9])_\{([^}]+)\}/g, ' $1 indice $2 ');
    s = s.replace(/([a-zA-Z0-9])_([a-zA-Z0-9])/g, ' $1 indice $2 ');
    s = s.replace(/\\cos/g, ' cosinus ');
    s = s.replace(/\\sin/g, ' sinus ');
    s = s.replace(/\\tan/g, ' tangente ');
    s = s.replace(/\\ln/g, ' logarithme népérien ');
    s = s.replace(/\\pi/g, ' pi ');
    s = s.replace(/\\times/g, ' fois ');
    s = s.replace(/\\div/g, ' divisé par ');
    s = s.replace(/\\infty/g, ' infini ');
    s = s.replace(/\\/g, ' ');
    s = s.replace(/[{}]/g, ' ');
    return s.replace(/\s+/g, ' ').trim();
  }

  function extractReadableContent() {
    const container = contentBody.querySelector('.lecture-container') || contentBody;
    if (!container) return [];

    const parts = [];
    const selectors = [
      '.lecture-hero h1', '.lecture-hero p',
      '.lecture-section h2', '.lecture-section h3', '.lecture-section p',
      '.lecture-callout', '.lecture-aside',
      '.lecture-example p', '.lecture-formula-main',
      '.lecture-step p', '.lecture-container > p'
    ];

    const elements = container.querySelectorAll(selectors.join(','));
    const seen = new Set();

    elements.forEach((el) => {
      if (seen.has(el)) return;
      if (el.closest('button') || el.matches('button')) return;
      let text = el.innerText || el.textContent || '';
      text = cleanTTS(text);
      if (!text) return;
      if (parts.some((p) => p.toLowerCase() === text.toLowerCase())) return;
      seen.add(el);
      parts.push(text);
    });

    if (parts.length === 0) {
      let fallback = container.innerText || container.textContent || '';
      fallback = cleanTTS(fallback);
      if (fallback) parts.push(fallback);
    }

    const chunks = [];
    parts.forEach((text) => {
      const sentences = text.match(/[^.!?]+[.!?]+|[^.!?]+$/g) || [text];
      let current = '';
      sentences.forEach((s) => {
        s = s.trim();
        if (!s) return;
        if ((current + ' ' + s).length <= 200) {
          current += (current ? ' ' : '') + s;
        } else {
          if (current) chunks.push(current.trim());
          current = s;
        }
      });
      if (current) chunks.push(current.trim());
    });

    return chunks.filter((c) => c.length > 1);
  }

  function updateTTSButton(state) {
    if (!ttsBtn) return;
    const icon = ttsBtn.querySelector('i');
    const text = ttsBtn.querySelector('span');
    if (state === 'speaking') {
      ttsBtn.classList.add('tts-speaking');
      ttsBtn.classList.remove('tts-paused');
      if (icon) icon.className = 'fas fa-pause';
      if (text) text.textContent = 'Pause';
    } else if (state === 'paused') {
      ttsBtn.classList.remove('tts-speaking');
      ttsBtn.classList.add('tts-paused');
      if (icon) icon.className = 'fas fa-play';
      if (text) text.textContent = 'Reprendre';
    } else {
      ttsBtn.classList.remove('tts-speaking', 'tts-paused');
      if (icon) icon.className = 'fas fa-volume-up';
      if (text) text.textContent = 'Écouter';
    }
  }

  function updateTTSProgress() {
    if (!ttsProgressFill || !tts.chunks.length) return;
    const p = ((tts.currentChunk + 1) / tts.chunks.length) * 100;
    ttsProgressFill.style.width = Math.min(100, p) + '%';
  }

  function resetTTSProgress() {
    if (ttsProgressFill) ttsProgressFill.style.width = '0%';
  }

  function speakChunk(index) {
    if (!TTS_SUPPORTED) return;
    if (index >= tts.chunks.length) { finishTTS(); return; }
    if (tts.stopRequested) return;

    tts.currentChunk = index;
    const text = tts.chunks[index];
    if (!text) { speakChunk(index + 1); return; }

    try { tts.synth.cancel(); } catch (e) {}

    const utterance = new SpeechSynthesisUtterance(text);
    tts.utterance = utterance;
    utterance.lang = 'fr-FR';
    utterance.rate = tts.rate;
    utterance.pitch = tts.pitch;
    utterance.volume = tts.volume;
    if (tts.voice) utterance.voice = tts.voice;

    utterance.onstart = () => {
      tts.isSpeaking = true;
      tts.isPaused = false;
      updateTTSButton('speaking');
      updateTTSProgress();
    };

    utterance.onend = () => {
      if (tts.stopRequested) return;
      const next = index + 1;
      if (next < tts.chunks.length) {
        setTimeout(() => {
          if (tts.isSpeaking && !tts.isPaused && !tts.stopRequested) speakChunk(next);
        }, 80);
      } else finishTTS();
    };

    utterance.onerror = (e) => {
      if (e.error === 'interrupted' || e.error === 'canceled') return;
      finishTTS();
    };

    tts.synth.speak(utterance);
    setTimeout(() => {
      if (tts.isSpeaking && !tts.isPaused && !tts.stopRequested) {
        try { tts.synth.resume(); } catch (e) {}
      }
    }, 100);
  }

  function startTTS() {
    if (!TTS_SUPPORTED) return;
    try { tts.synth.cancel(); } catch (e) {}
    tts.stopRequested = false;
    tts.chunks = extractReadableContent();
    if (!tts.chunks.length) return;
    loadTTSVoices();
    tts.currentChunk = 0;
    tts.isSpeaking = true;
    tts.isPaused = false;
    tts.isActive = true;
    ttsProgress.classList.add('active');
    resetTTSProgress();
    updateTTSButton('speaking');
    speakChunk(0);
  }

  function pauseTTS() {
    if (!TTS_SUPPORTED || !tts.synth || !tts.isSpeaking) return;
    try { tts.synth.cancel(); } catch (e) {}
    tts.isPaused = true;
    tts.isSpeaking = false;
    updateTTSButton('paused');
  }

  function resumeTTS() {
    if (!TTS_SUPPORTED || !tts.synth || !tts.isPaused) return;
    tts.isPaused = false;
    tts.isSpeaking = true;
    tts.stopRequested = false;
    updateTTSButton('speaking');
    setTimeout(() => {
      if (tts.isSpeaking && !tts.isPaused && !tts.stopRequested) speakChunk(tts.currentChunk);
    }, 150);
  }

  function stopTTS() {
    if (!TTS_SUPPORTED || !tts.synth) return;
    tts.stopRequested = true;
    try { tts.synth.cancel(); } catch (e) {}
    tts.isSpeaking = false;
    tts.isPaused = false;
    tts.isActive = false;
    tts.utterance = null;
    tts.currentChunk = 0;
    updateTTSButton('stopped');
    resetTTSProgress();
    ttsProgress.classList.remove('active');
  }

  function finishTTS() {
    tts.isSpeaking = false;
    tts.isPaused = false;
    tts.isActive = false;
    tts.stopRequested = false;
    tts.utterance = null;
    updateTTSButton('stopped');
    if (ttsProgressFill) {
      ttsProgressFill.style.width = '100%';
      setTimeout(() => {
        if (!tts.isSpeaking) {
          ttsProgressFill.style.width = '0%';
          ttsProgress.classList.remove('active');
        }
      }, 1000);
    }
  }

  if (ttsBtn) {
    ttsBtn.addEventListener('click', () => {
      if (!TTS_SUPPORTED) return;
      if (tts.isSpeaking) pauseTTS();
      else if (tts.isPaused) resumeTTS();
      else startTTS();
    });
  }

  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden' && tts.isSpeaking) {
      try { tts.synth.pause(); } catch (e) {}
    }
  });

  window.addEventListener('beforeunload', () => {
    try { if (tts.synth) tts.synth.cancel(); } catch (e) {}
  });

  // ================================================================
  // SUIVI DU TEMPS D'ÉTUDE
  // ================================================================
  let studyStartTime = Date.now();
  let studyTimeActive = true;

  document.addEventListener('visibilitychange', () => {
    if (document.hidden) pauseStudyTime();
    else resumeStudyTime();
  });

  function pauseStudyTime() {
    if (!studyTimeActive) return;
    const duration = Math.floor((Date.now() - studyStartTime) / 1000);
    if (duration >= 5) saveStudyTime(duration);
    studyTimeActive = false;
  }

  function resumeStudyTime() {
    studyStartTime = Date.now();
    studyTimeActive = true;
  }

  window.addEventListener('beforeunload', () => {
    pauseStudyTime();
  });

  function saveStudyTimeBeforeChange() {
    const duration = Math.floor((Date.now() - studyStartTime) / 1000);
    if (duration >= 5) saveStudyTime(duration);
    studyStartTime = Date.now();
  }

  async function saveStudyTime(seconds) {
    const user = auth.currentUser;
    if (!user) return;
    try {
      const userRef = doc(db, 'users', user.uid);
      const snap = await getDoc(userRef);
      if (snap.exists()) {
        const current = snap.data().totalStudyTime || 0;
        await updateDoc(userRef, {
          totalStudyTime: current + seconds,
          lastStudyUpdate: serverTimestamp()
        });
      }
    } catch (e) { /* silencieux */ }
  }

  function resetStudyTimer() {
    studyStartTime = Date.now();
    studyTimeActive = true;
  }

  // ================================================================
  // USER DATA (temps réel)
  // ================================================================
  function loadUserRealtime(uid) {
    if (unsubscribeUser) unsubscribeUser();
    unsubscribeUser = onSnapshot(doc(db, 'users', uid), (snap) => {
      if (snap.exists()) {
        const data = snap.data();
        saveUserDataToCache(data, uid);
        const newPremium = isUserPremium(data);
        if (newPremium !== isPremium) isPremium = newPremium;
      }
    }, (err) => { /* silencieux */ });
  }

  // ================================================================
  // LANCER
  // ================================================================
  authGuard(async (user, cachedUserData) => {
    isPremium = cachedUserData ? isUserPremium(cachedUserData) : false;
    loadContent();
    loadUserRealtime(user.uid);
  });

  console.log('🚀 ARVEXA — Lecture (v2 mutualisée)');
  </script>
