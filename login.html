<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
  <meta name="theme-color" content="#0A0A0A">
  <meta name="description" content="ARVEXA School - Connexion">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="icon" href="icon.png" type="image/png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin>

  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Playfair+Display:wght@700&display=swap">
  <link rel="preload" as="image" href="icon.png" fetchpriority="high">

  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Playfair+Display:wght@700&display=swap">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="assets/arvexa-tokens.css">
  <link rel="stylesheet" href="assets/arvexa-core.css">

  <style>
    body {
      padding-top: var(--safe-top);
      padding-bottom: var(--safe-bottom);
    }
    .auth-shell {
      flex: 1;
      width: 100%;
      max-width: 540px;
      margin: 0 auto;
      padding: 0 20px 60px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      animation: arvPageEnter .6s cubic-bezier(.25,1,.5,1);
    }
    @keyframes arvPageEnter {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .auth-header {
      width: 100%;
      max-width: 540px;
      margin: 0 auto;
      padding: 20px 20px 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }
    .auth-logo {
      display: inline-flex;
      text-decoration: none;
      font-family: var(--font-serif);
      font-size: clamp(18px, 3vw, 22px);
      font-weight: 700;
      letter-spacing: .5px;
      color: var(--text-light);
    }
    .auth-logo span {
      background: linear-gradient(90deg, var(--accent), var(--accent-bright), var(--accent));
      background-size: 200% auto;
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      font-style: italic;
      margin-left: 4px;
      animation: shimmerText 5s linear infinite;
    }
    .auth-header-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12.5px;
      font-weight: 500;
      color: var(--text-dim);
      text-decoration: none;
      padding: 8px 14px;
      border-radius: 30px;
      border: 1px solid var(--border-soft);
      transition: var(--transition-fast);
      white-space: nowrap;
    }
    .auth-header-link:hover {
      color: var(--text-light);
      border-color: rgba(184, 134, 11, 0.2);
      background: rgba(184, 134, 11, 0.04);
    }
    .auth-header-link i { font-size: 11px; }

    .auth-hero {
      text-align: center;
      padding: 24px 0 28px;
    }
    .auth-hero-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 72px;
      height: 72px;
      border-radius: 22px;
      background: linear-gradient(135deg, rgba(184,134,11,.15), rgba(26,58,42,.1));
      border: 1px solid rgba(184,134,11,.2);
      font-size: 32px;
      margin-bottom: 20px;
      animation: iconFloat 3s ease-in-out infinite;
    }
    @keyframes iconFloat {
      0%, 100% { transform: translateY(0) rotate(-2deg); }
      50% { transform: translateY(-8px) rotate(2deg); }
    }
    .auth-hero h1 {
      font-family: var(--font-serif);
      font-size: clamp(28px, 6vw, 38px);
      font-weight: 700;
      line-height: 1.15;
      letter-spacing: -0.02em;
      color: var(--text-light);
      margin-bottom: 12px;
    }
    .auth-hero h1 em { color: var(--accent); font-style: italic; }
    .auth-hero p {
      font-size: clamp(13px, 1.8vw, 14.5px);
      color: var(--text-dim);
      line-height: 1.6;
      max-width: 380px;
      margin: 0 auto;
    }

    .auth-card {
      background: var(--bg-card);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      border-radius: var(--radius-xl);
      padding: 28px 24px;
      box-shadow: var(--shadow);
      position: relative;
      overflow: hidden;
    }
    .auth-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; height: 2px;
      background: linear-gradient(90deg, var(--accent), var(--accent-bright), var(--success), var(--accent));
      background-size: 300% 100%;
      animation: borderShimmer 6s linear infinite;
    }
    @keyframes borderShimmer {
      0% { background-position: 0% 0%; }
      100% { background-position: 300% 0%; }
    }

    .auth-field { margin-bottom: 18px; }
    .auth-field-label {
      display: block;
      font-size: 12.5px;
      font-weight: 500;
      color: var(--text-dim);
      margin-bottom: 8px;
    }
    .auth-input-wrap {
      position: relative;
      display: flex;
      align-items: center;
      background: rgba(255,255,255,.03);
      border: 1px solid var(--border-soft);
      border-radius: var(--radius);
      transition: var(--transition-fast);
      overflow: hidden;
    }
    .auth-input-wrap:focus-within {
      border-color: rgba(184,134,11,.4);
      background: rgba(184,134,11,.02);
      box-shadow: 0 0 0 4px rgba(184,134,11,.06);
    }
    .auth-input-wrap.is-error {
      border-color: rgba(231, 76, 60, .4);
      background: rgba(231, 76, 60, .02);
    }
    .auth-input-wrap.is-success { border-color: rgba(45, 125, 90, .4); }
    .auth-input-wrap .icon {
      padding: 0 4px 0 16px;
      color: var(--text-muted);
      font-size: 14px;
      flex-shrink: 0;
      transition: var(--transition-fast);
    }
    .auth-input-wrap:focus-within .icon { color: var(--accent-bright); }
    .auth-input-wrap.is-error .icon { color: var(--danger); }

    .auth-input-wrap input {
      flex: 1;
      min-width: 0;
      padding: 13px 14px 13px 10px;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text-light);
      font-size: 15px;
      font-family: inherit;
    }
    .auth-input-wrap input::placeholder { color: var(--text-muted); }
    .auth-input-wrap input:-webkit-autofill {
      -webkit-box-shadow: 0 0 0 30px #1a1a1a inset !important;
      -webkit-text-fill-color: var(--text-light) !important;
    }

    .auth-toggle-pwd {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      width: 32px; height: 32px;
      border-radius: 8px;
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      transition: var(--transition-fast);
    }
    .auth-toggle-pwd:hover {
      color: var(--accent-bright);
      background: rgba(184,134,11,.08);
    }

    .auth-field-help {
      display: none;
      font-size: 11.5px;
      color: var(--text-muted);
      margin-top: 6px;
      padding-left: 4px;
      line-height: 1.5;
    }
    .auth-field-help.visible { display: block; }
    .auth-field-help.error { color: var(--danger); }

    .auth-options {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 6px 0 22px;
      flex-wrap: wrap;
      gap: 10px;
    }
    .auth-remember {
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      user-select: none;
    }
    .auth-remember input[type="checkbox"] {
      appearance: none;
      -webkit-appearance: none;
      width: 20px; height: 20px;
      min-width: 20px;
      border: 2px solid rgba(255,255,255,.15);
      border-radius: 6px;
      background: transparent;
      cursor: pointer;
      position: relative;
      transition: var(--transition-fast);
    }
    .auth-remember input[type="checkbox"]:checked {
      background: linear-gradient(135deg, var(--accent-bright), var(--accent));
      border-color: var(--accent);
    }
    .auth-remember input[type="checkbox"]:checked::after {
      content: '';
      position: absolute;
      left: 5px; top: 1px;
      width: 6px; height: 11px;
      border: solid #0A0A0A;
      border-width: 0 2px 2px 0;
      transform: rotate(45deg);
    }
    .auth-remember label {
      font-size: 12.5px;
      color: var(--text-dim);
      cursor: pointer;
    }
    .auth-forgot {
      font-size: 12.5px;
      color: var(--accent-bright);
      text-decoration: none;
      font-weight: 500;
      border-bottom: 1px solid transparent;
      transition: var(--transition-fast);
    }
    .auth-forgot:hover { border-bottom-color: var(--accent-bright); }

    .auth-submit {
      width: 100%;
      padding: 15px 20px;
      border: none;
      border-radius: 30px;
      background: linear-gradient(135deg, var(--accent-bright), var(--accent));
      color: #0A0A0A;
      font-family: inherit;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: var(--transition);
      min-height: 54px;
      box-shadow: 0 4px 20px rgba(184,134,11,.15);
    }
    .auth-submit:not(:disabled):hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 32px rgba(184,134,11,.35);
    }
    .auth-submit:not(:disabled):active { transform: scale(0.98); }
    .auth-submit:disabled { opacity: 0.35; cursor: not-allowed; box-shadow: none; }
    .auth-submit .spinner {
      display: none;
      width: 18px; height: 18px;
      border: 2px solid rgba(10,10,10,.2);
      border-top-color: #0A0A0A;
      border-radius: 50%;
      animation: arvSpin .7s linear infinite;
    }
    .auth-submit.loading .spinner { display: block; }
    .auth-submit.loading .btn-icon,
    .auth-submit.loading .btn-text { display: none; }

    .auth-divider {
      display: flex;
      align-items: center;
      gap: 16px;
      margin: 22px 0 18px;
    }
    .auth-divider .line { flex: 1; height: 1px; background: rgba(255,255,255,.06); }
    .auth-divider .text {
      font-size: 11.5px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 1.5px;
      font-weight: 600;
    }

    .auth-register {
      width: 100%;
      padding: 13px;
      border-radius: 30px;
      border: 1px solid var(--border-soft);
      background: transparent;
      color: var(--text-dim);
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: var(--transition);
      font-family: inherit;
      text-decoration: none;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }
    .auth-register:hover {
      border-color: rgba(184,134,11,.15);
      color: var(--text-light);
      background: rgba(255,255,255,.03);
      transform: translateY(-1px);
    }

    .auth-security {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 18px;
      font-size: 11.5px;
      color: var(--text-muted);
    }
    .auth-security i { color: var(--success-light); font-size: 11px; }

    .auth-footer {
      margin-top: 32px;
      padding-top: 20px;
      border-top: 1px solid rgba(255,255,255,.04);
      text-align: center;
      font-size: 11px;
      color: var(--text-muted);
      line-height: 1.6;
    }
    .auth-footer a {
      color: var(--text-dim);
      text-decoration: none;
      transition: var(--transition-fast);
    }
    .auth-footer a:hover { color: var(--accent-bright); }

    @media (max-width: 480px) {
      .auth-header { padding: 16px 16px 0; }
      .auth-shell { padding: 0 16px 40px; }
      .auth-hero { padding: 20px 0 22px; }
      .auth-hero-icon { width: 62px; height: 62px; font-size: 28px; margin-bottom: 16px; }
      .auth-card { padding: 22px 18px; }
      .auth-submit { padding: 13px 18px; min-height: 50px; font-size: 14px; }
      .auth-options { flex-direction: column; align-items: flex-start; gap: 8px; }
    }
    @media (min-width: 768px) {
      .auth-header { max-width: 560px; padding: 24px 24px 0; }
      .auth-shell { max-width: 560px; padding: 0 24px 60px; }
      .auth-card { padding: 32px 28px; }
    }
  </style>

  <script src="assets/arvexa-transitions.js" defer></script>
  <script src="register-sw.js" defer></script>
</head>
<body>

  <header class="auth-header">
    <a href="index.html" class="auth-logo">ARVEX<span>A School</span></a>
    <a href="register.html" class="auth-header-link">
      <i class="fas fa-user-plus"></i>
      <span>Pas encore membre ?</span>
    </a>
  </header>

  <main class="auth-shell">

    <section class="auth-hero">
      <div class="auth-hero-icon">🔐</div>
      <h1>Content de te <em>revoir</em> !</h1>
      <p>Retrouve ton espace personnel et continue ta préparation pour le BAC.</p>
    </section>

    <div class="auth-card">
      <form id="loginForm" novalidate>

        <div class="auth-field">
          <label class="auth-field-label" for="emailInput">Adresse e-mail</label>
          <div class="auth-input-wrap" id="emailWrap">
            <span class="icon"><i class="fas fa-envelope"></i></span>
            <input type="email" id="emailInput" placeholder="exemple@email.com"
                   autocomplete="email" inputmode="email" required>
          </div>
          <div class="auth-field-help" id="emailHelp"></div>
        </div>

        <div class="auth-field">
          <label class="auth-field-label" for="passwordInput">Mot de passe</label>
          <div class="auth-input-wrap" id="passwordWrap">
            <span class="icon"><i class="fas fa-lock"></i></span>
            <input type="password" id="passwordInput" placeholder="Entre ton mot de passe"
                   autocomplete="current-password" required minlength="6">
            <button type="button" class="auth-toggle-pwd" id="togglePassword"
                    aria-label="Afficher le mot de passe">
              <i class="fas fa-eye"></i>
            </button>
          </div>
          <div class="auth-field-help" id="passwordHelp"></div>
        </div>

        <div class="auth-options">
          <label class="auth-remember">
            <input type="checkbox" id="rememberMe">
            <label for="rememberMe">Se souvenir de moi</label>
          </label>
          <a href="forgot-password.html" class="auth-forgot">Mot de passe oublié ?</a>
        </div>

        <button type="submit" class="auth-submit" id="loginBtn" disabled>
          <span class="btn-icon"><i class="fas fa-sign-in-alt"></i></span>
          <span class="btn-text">Se connecter</span>
          <span class="spinner"></span>
        </button>
      </form>

      <div class="auth-divider">
        <span class="line"></span>
        <span class="text">ou</span>
        <span class="line"></span>
      </div>

      <a href="register.html" class="auth-register">
        <i class="fas fa-user-plus"></i>
        Créer un nouveau compte
      </a>

      <div class="auth-security">
        <i class="fas fa-shield-alt"></i>
        <span>Connexion sécurisée par Firebase</span>
      </div>
    </div>

    <footer class="auth-footer">
      © 2026 ARVEXA School — Tous droits réservés · <a href="#">Aide</a>
    </footer>
  </main>

  <script type="importmap">
  {
    "imports": {
      "firebase/auth": "https://www.gstatic.com/firebasejs/12.12.1/firebase-auth.js",
      "firebase/firestore": "https://www.gstatic.com/firebasejs/12.12.1/firebase-firestore.js"
    }
  }
  </script>

  <script type="module">
  // ================================================================
  // LOGIN.HTML — Logique métier
  // ================================================================

  import { auth, db } from './assets/arvexa-firebase.js';
  import { toast } from './assets/arvexa-ui.js';
  import {
    signInWithEmailAndPassword, signOut, onAuthStateChanged
  } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-auth.js";
  import {
    doc, getDoc, updateDoc, serverTimestamp
  } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-firestore.js";

  // Masquer la page tant que l'auth n'est pas résolue
  document.documentElement.classList.add('arv-auth-hard-wait');

  // ================================================================
  // DOM
  // ================================================================
  const $ = (id) => document.getElementById(id);
  const form = $('loginForm');
  const emailInput = $('emailInput');
  const passwordInput = $('passwordInput');
  const loginBtn = $('loginBtn');
  const rememberMe = $('rememberMe');
  const togglePassword = $('togglePassword');
  const emailWrap = $('emailWrap');
  const passwordWrap = $('passwordWrap');
  const emailHelp = $('emailHelp');
  const passwordHelp = $('passwordHelp');

  const REMEMBER_KEY = 'arvexa_remember_email';
  const SESSION_KEY = 'arvexa_session';
  const LAST_UID_KEY = 'arvexa_last_uid';

  // ================================================================
  // RÉVÉLER LA PAGE
  // ================================================================
  function revealPage() {
    document.documentElement.classList.remove('arv-auth-hard-wait');
  }

  // ================================================================
  // VALIDATION
  // ================================================================
  const EMAIL_REGEX = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

  function validateEmail(v) { return EMAIL_REGEX.test(v.trim()); }

  function validateForm() {
    const email = emailInput.value.trim();
    const password = passwordInput.value.trim();
    loginBtn.disabled = !(validateEmail(email) && password.length >= 6);
  }

  function validateField(field) {
    const input = field === 'email' ? emailInput : passwordInput;
    const wrap = field === 'email' ? emailWrap : passwordWrap;
    const help = field === 'email' ? emailHelp : passwordHelp;

    const value = input.value.trim();
    let isValid, errorMsg;

    if (field === 'email') {
      isValid = validateEmail(value);
      errorMsg = "Format d'e-mail invalide";
    } else {
      isValid = value.length >= 6;
      errorMsg = 'Le mot de passe doit contenir au moins 6 caractères';
    }

    const hasError = !isValid && value.length > 0;
    wrap.classList.toggle('is-error', hasError);
    wrap.classList.toggle('is-success', isValid && value.length > 0);

    help.className = 'auth-field-help';
    if (hasError) {
      help.classList.add('visible', 'error');
      help.textContent = errorMsg;
    } else {
      help.textContent = '';
    }
  }

  emailInput.addEventListener('input', () => { validateField('email'); validateForm(); });
  passwordInput.addEventListener('input', () => { validateField('password'); validateForm(); });
  emailInput.addEventListener('blur', () => validateField('email'));
  passwordInput.addEventListener('blur', () => validateField('password'));

  togglePassword.addEventListener('click', function () {
    const isPwd = passwordInput.getAttribute('type') === 'password';
    passwordInput.setAttribute('type', isPwd ? 'text' : 'password');
    this.querySelector('i').className = isPwd ? 'fas fa-eye-slash' : 'fas fa-eye';
    this.setAttribute('aria-label', isPwd ? 'Masquer le mot de passe' : 'Afficher le mot de passe');
  });

  // ================================================================
  // EMAIL MÉMORISÉ
  // ================================================================
  const savedEmail = localStorage.getItem(REMEMBER_KEY);
  if (savedEmail) {
    emailInput.value = savedEmail;
    rememberMe.checked = true;
    validateField('email');
    validateForm();
  }

  // ================================================================
  // ÉTAT
  // ================================================================
  let isRedirecting = false;
  let currentUid = null;
  let isSubmitting = false;

  // ================================================================
  // REDIRECTION APRÈS LOGIN
  // ================================================================
  function redirectAfterLogin(user) {
    if (isRedirecting) return;
    isRedirecting = true;
    currentUid = user.uid;

    // Sauvegarder la session AVANT redirection
    try {
      localStorage.setItem(SESSION_KEY, JSON.stringify({
        uid: user.uid, email: user.email, lastActive: Date.now()
      }));
      localStorage.setItem(LAST_UID_KEY, user.uid);
    } catch (e) {}

    // Récupérer la page de destination
    const requested = sessionStorage.getItem('redirectAfterLogin')
      || sessionStorage.getItem('redirectAfterAuth')
      || 'index.html';
    const safe = requested.startsWith('/') || (!requested.includes(':') && !requested.startsWith('//'))
      ? requested
      : 'index.html';

    sessionStorage.removeItem('redirectAfterLogin');
    sessionStorage.removeItem('redirectAfterAuth');

    // La page reste masquée jusqu'à la redirection effective
    setTimeout(() => location.replace(safe), 100);
  }

  // ================================================================
  // AUTH STATE — Redirection si déjà connecté
  // ================================================================
  let authResolved = false;
  onAuthStateChanged(auth, (user) => {
    if (authResolved) return;
    authResolved = true;

    if (user) {
      redirectAfterLogin(user);
    } else {
      revealPage();
    }
  });

  // Timeout max sécurité
  setTimeout(() => {
    if (authResolved) return;
    authResolved = true;
    revealPage();
  }, 2500);

  // ================================================================
  // SOUMISSION
  // ================================================================
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    if (isSubmitting || loginBtn.disabled) return;

    isSubmitting = true;
    loginBtn.disabled = true;
    loginBtn.classList.add('loading');

    const email = emailInput.value.trim();
    const password = passwordInput.value.trim();

    try {
      const cred = await signInWithEmailAndPassword(auth, email, password);
      const user = cred.user;

      // Vérifier que le profil existe
      const userRef = doc(db, 'users', user.uid);
      const userDoc = await getDoc(userRef);

      if (!userDoc.exists()) {
        await signOut(auth);
        toast('Profil introuvable. Redirection...', 'error');
        setTimeout(() => location.replace('register.html'), 1500);
        isSubmitting = false;
        loginBtn.disabled = false;
        loginBtn.classList.remove('loading');
        return;
      }

      const data = userDoc.data();

      if (data.accountStatus === 'blocked') {
        await signOut(auth);
        toast('❌ Ton compte est bloqué. Contacte le support.', 'error', 6000);
        isSubmitting = false;
        loginBtn.disabled = false;
        loginBtn.classList.remove('loading');
        return;
      }

      if (data.accountStatus === 'paused') {
        await signOut(auth);
        toast('⏸️ Ton compte est en pause. Contacte le support.', 'error', 6000);
        isSubmitting = false;
        loginBtn.disabled = false;
        loginBtn.classList.remove('loading');
        return;
      }

      // Remember me
      if (rememberMe.checked) localStorage.setItem(REMEMBER_KEY, email);
      else localStorage.removeItem(REMEMBER_KEY);

      // Update lastLogin
      try { await updateDoc(userRef, { lastLogin: serverTimestamp() }); } catch (e) {}

      toast('✅ Connexion réussie !', 'success');
      redirectAfterLogin(user);

    } catch (error) {
      let message = 'Une erreur est survenue.';
      switch (error.code) {
        case 'auth/user-not-found':
          message = '❌ Aucun compte trouvé pour cet e-mail.';
          break;
        case 'auth/wrong-password':
        case 'auth/invalid-credential':
          message = '❌ Mot de passe incorrect.';
          break;
        case 'auth/too-many-requests':
          message = '⏳ Trop de tentatives. Réessaie dans quelques minutes.';
          break;
        case 'auth/invalid-email':
          message = '❌ Adresse e-mail invalide.';
          break;
        case 'auth/network-request-failed':
          message = '📶 Problème de connexion réseau.';
          break;
        default:
          message = '❌ ' + (error.message || 'Erreur inconnue');
      }
      toast(message, 'error', 6000);
      loginBtn.disabled = false;
      loginBtn.classList.remove('loading');
      isSubmitting = false;
    }
  });

  console.log('🚀 ARVEXA — Login (v2)');
  </script>

</body>
</html>
